<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teendőkezelő | Regisztráció</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul id="nav-items">
        </ul>
    </nav>
    <main>
        <section id="register-view">
            <h2>Regisztráció</h2>
            <form onsubmit="register(event)">
                <input type="text" id="reg-name" placeholder="Teljes név" required>
                <input type="email" id="reg-email" placeholder="Email cím" required>
                <input type="text" id="reg-username" placeholder="Felhasználónév" required>
                <input type="password" id="reg-password" placeholder="Jelszó" required>
                <input type="password" id="reg-password-confirm" placeholder="Jelszó újra" required>
                <button type="submit">Regisztráció</button>
            </form>
            <p>Már van fiókod? <a href="login.html">Jelentkezz be itt</a></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

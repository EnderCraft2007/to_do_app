<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teendőkezelő | Bejelentkezés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul id="nav-items">
        </ul>
    </nav>
    <main>
        <section id="login-view">
            <h2>Bejelentkezés</h2>
            <form onsubmit="login(event)">
                <input type="text" id="login-username" placeholder="Felhasználónév" required>
                <input type="password" id="login-password" placeholder="Jelszó" required>
                <button type="submit">Bejelentkezés</button>
            </form>
            <p>Nincs még fiókod? <a href="register.html">Regisztrálj itt</a></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

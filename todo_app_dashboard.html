<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teendőkezelő | Vezérlőpult</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul id="nav-items">
        </ul>
    </nav>
    <main>
        <section id="user-events-view">
            <div id="create-event-area">
                <h2>Új Esemény Létrehozása</h2>
                <form onsubmit="createEvent(event)">
                    <input type="text" id="new-event-title" placeholder="Esemény címe" required>
                    <input type="date" id="new-event-date" required>
                    <button type="submit">Esemény létrehozása</button>
                </form>
            </div>
            
            <hr style="margin: 20px 0;">
            
            <h2>Saját/Felvett Események</h2>
            <ul id="user-event-list">
            </ul>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>

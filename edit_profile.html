<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil szerkesztése - To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Profil szerkesztése</h1>
        <nav>
            <ul id="nav-items">
                <!-- JavaScript tölti fel -->
            </ul>
        </nav>
    </header>
    <main>
        <section id="edit-profile-area">
            <form id="edit-profile-form">
                <div class="form-group">
                    <label for="edit-profile-name">Név:</label>
                    <input type="text" id="edit-profile-name">
                </div>
                <div class="form-group">
                    <label for="edit-profile-email">Email:</label>
                    <input type="email" id="edit-profile-email">
                </div>
                <div class="form-group">
                    <label for="edit-profile-phone">Telefon:</label>
                    <input type="text" id="edit-profile-phone">
                </div>
                <div class="form-group">
                    <label for="edit-profile-city">Város:</label>
                    <input type="text" id="edit-profile-city">
                </div>
                <div class="form-group">
                    <label for="edit-profile-birthdate">Születési dátum:</label>
                    <input type="date" id="edit-profile-birthdate">
                </div>
                <button type="submit">Adatok frissítése</button>
                <button type="button" onclick="window.location.href='profile.html'">Mégse</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
